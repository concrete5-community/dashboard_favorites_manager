name: Create GitHub Release

on:
  push:
    tags:
      - '*'

jobs:
  verify-tests:
    name: Require successful tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      -
        name: Check tests for the tagged commit
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: context.ref,
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'tests.yml', head_sha: commit.sha,
              branch: 'main', event: 'push', per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (!run || run.head_sha !== commit.sha || run.head_branch !== 'main'
                || run.event !== 'push' || run.status !== 'completed'
                || run.conclusion !== 'success') {
              core.setFailed(`Tests must pass on main for ${commit.sha} before publishing this tag.`);
              return;
            }
            core.info(`Verified successful tests: ${run.html_url}`);

  create-release:
    name: Create GitHub Release
    needs: verify-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2.2
          coverage: none
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Create release
        uses: concrete5-community/gh-package-release-attach@main
        with:
          remove-files: |
            composer.json
          publish-release: true
